# playhq-sync — PlayHQ fixture proxy + nightly auto-sync for one club's
# OwnClub App deployment.
#
# ── PER-CLUB SETUP ────────────────────────────────────────────────────────
# One Worker per club. To onboard a new club (e.g. BUCC):
#   1. Copy this file, change `name` to a unique value (playhq-sync-<club>)
#      and edit every value in [vars] for that club.
#   2. Set the secrets below for that club:
#        wrangler secret put <NAME> --config <this file>
#   3. Point the club app's CLUB_CONFIG.playhqSyncUrl at the new Worker URL.
#
# Secrets (never in this file):
#   PLAYHQ_API_KEY            — issued by PlayHQ support for the club
#   PLAYHQ_TENANT             — sport tenant code, e.g. "ca" (Cricket Aus), "bv" (Basketball Vic)
#   PLAYHQ_ORG_ID             — the club's full PlayHQ organisation UUID (primary
#                               club matcher; find it via the club's public page API traffic)
#   SUPABASE_URL              — the club's Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY — the club's Supabase service-role key
#   ADMIN_SECRET              — random string gating /sync and /debug
#   PLAYHQ_SEASON_ID          — (optional legacy fallback when PLAYHQ_ORG_ID unset)
#
# `wrangler deploy` never touches secrets — only `wrangler secret put` does.

name = "playhq-sync"
main = "playhq-sync-worker.js"
compatibility_date = "2026-07-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 3 * * *"]

[observability]
enabled = true

[vars]
# Per-club, but not secret.
# PLAYHQ_CLUB_NAME: name-substring fallback for matching the club's teams when
# PLAYHQ_ORG_ID is unset — use the club name AS IT APPEARS ON PLAYHQ, which may
# differ from the app's branding (e.g. "Bundoora United", not "BUCC").
PLAYHQ_CLUB_NAME = "Laurimar"
# Match type is not published by PlayHQ's public API, so it's derived from the
# fixture's round spacing (a two-day game pushes the next round out 14 days).
# Set BOTH to enable; leave PLAYHQ_TWO_DAY_FORMAT unset for a club whose
# competition isn't one/two-day — e.g. fortnightly fixtures would otherwise
# all be labelled two-day. Values should match CLUB_CONFIG.matchFormats.
PLAYHQ_ONE_DAY_FORMAT = "One Day match"
PLAYHQ_TWO_DAY_FORMAT = "2 Day match"
# The competition's mid-season shutdown (MM-DD, may wrap the year end). A long
# gap normally means a two-day round, but not when the notional second weekend
# falls in here — that's a one-day game followed by the break. Verified across
# four DVCA seasons. Leave unset for a competition with no shutdown.
PLAYHQ_BREAK_FROM = "12-24"
PLAYHQ_BREAK_TO   = "01-01"
# A grade's final round has nothing after it to measure against until finals
# are published (once they are, the calendar resolves it like any other round).
# In all three completed DVCA seasons the last home-and-away round was one-day
# with finals the following Saturday, so that's the stated convention.
PLAYHQ_LAST_ROUND_FORMAT = "One Day match"
ONESIGNAL_PROXY_URL = "https://onesignal-proxy.thomsonseth.workers.dev"
APP_URL = "https://laurimar-power.netlify.app"
